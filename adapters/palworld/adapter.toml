# ============================================================
# adapters/palworld/adapter.toml —— 幻兽帕鲁（Palworld）适配器声明式元数据
#
# 状态：草案（路线图 ①，待 ② hooks/模板、③ Dockerfile/镜像 后转正式）
# 关联：docs/game-adapter-roadmap.md §3.1（第一梯队）/ docs/a2s-probe-design.md
#
# 平台消费链（adapter-framework-design.md §3.3）：
#   asset_service：注册 adapter + 建 GameBuild（镜像名/版本 + metadata/schema）
#   controller：port_inject / config schema（表单与校验）
#   node_agent：lifecycle 命令路径（docker exec）
#
# ── 硬事实（已核实）────────────────────────────────────────────
#   steamcmd appid: 2394010（官方 Linux 专用服务器，PalServer.sh）
#   主进程:        PalServer-Linux-Test（UE5 二进制，PalServer.sh 拉起）
#   默认端口:      8211/udp（游戏 + A2S 查询同端口）
#   可选端口:      RCON 25575/tcp（默认关）、REST API 8212/tcp（默认关）
#   配置路径:      <install>/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
#                  （/server 只读 → 由 hook 软链到 /data，见下）
#   存档:          <install>/Pal/Saved/SaveGames（→ 软链 /data/SaveGames）
#   A2S 查询:      支持，query_port_offset = 0（controller game_container_configs
#                  probe_mode='a2s' 时生效，见 docs/a2s-probe-design.md §4）
# ── 渲染模型（② 已定案）──────────────────────────────────────
#   PalWorldSettings.ini 是单行 OptionSettings=(k=v,...)，与 per-key
#   xml_property 渲染不匹配 → config_render.file 置空，渲染由 hooks.sh 自管：
#     hooks.sh hook_pre_start：软链（/server 只读）+ config_env_export +
#     config_env_defaults（config-defaults.env 补齐默认值）+ envsubst 全量渲染。
#   默认值单一事实源：config-defaults.env（gen_manifest.py 从本文件生成）。
# ── 开放问题（② 状态）────────────────────────────────────────
#   [P-1] ✅ 已解决：hook 自管 envsubst 渲染（见 hooks.sh 头注释）
#   [P-2] ✅ 已解决：ini/Logs/SaveGames 软链到 /data（hooks.sh hook_pre_start）
#   [P-3] ✅ 已解决：steamclient.so 启动前校验（hooks.sh hook_pre_start）
#   [P-4] ⬜ 平台 AdapterConfigSetting 尚无 float 类型 → 倍率类项暂用
#         type="string"（值形如 "1.000000"），后续可在校验器加 float 类型
# ============================================================

schema_version = 1
adapter_id = "palworld"
game_id = "palworld"

[image]
name = "registry/game/palworld-adapter"
tag = "0.1.0-draft"                  # 占位：③ 构建镜像后改为实际版本

[build]
type = "steamcmd"
app_id = 2394010
branch = "public"

[lifecycle]
start = "/scripts/start.sh"
save = "/scripts/save.sh"
stop = "/scripts/stop.sh"
players = "/scripts/players.sh"
health = "/scripts/health.sh"

# 端口注入：宿主端口 → -port 启动参数 + PalWorldSettings.ini 的 PublicPort
[port_inject]
enabled = true
env = "GAME_HOST_PORT"

# 配置渲染目标文件：空（单行 OptionSettings 无法 per-key 渲染，
# 由 hooks.sh 自管 envsubst 全量渲染，见文件头「渲染模型」）
[config_render]
file = ""

# 无外部受限凭证（Palworld 不需要 token 类凭证）：
# [[credentials]] 留空，后续若引入需在平台录入资源池再声明。

# ───────────────────────── 配置项 schema ─────────────────────────
# 说明：bool 在 PalWorldSettings.ini 中为 True/False（首字母大写），
#       schema 值域为 true/false，由 hook 渲染时转换。

# ---- 基础 General ----
[config."ServerName"]
label_key = "cfg.ServerName.label"
type = "string"
default = "Default Dedicated Server"
control = "player"
apply = "always"
group_key = "grp.general"

[config."ServerDescription"]
type = "string"
default = ""
control = "player"
apply = "always"
group_key = "grp.general"

[config."ServerPassword"]
label_key = "cfg.ServerPassword.label"
type = "string"
secret = true
default = ""
control = "player"
apply = "always"
group_key = "grp.general"

[config."PublicIP"]
label_key = "cfg.PublicIP.label"
type = "string"
default = ""
control = "platform"
apply = "always"
group_key = "grp.general"

[config."Region"]
type = "string"
default = ""
control = "platform"
apply = "always"
group_key = "grp.general"

[config."AllowConnectPlatform"]
label_key = "cfg.AllowConnectPlatform.label"
type = "enum"
enum = ["Steam", "PS5", "SteamAndPS5"]
default = "Steam"
control = "platform"
apply = "always"
group_key = "grp.general"
[config."AllowConnectPlatform".enum_labels]
Steam = "enum.platform.steam"
PS5 = "enum.platform.ps5"
SteamAndPS5 = "enum.platform.both"

[config."bShowPlayerList"]
type = "bool"
default = true
control = "player"
apply = "always"
group_key = "grp.general"

