max = 12
default = 12
control = "player"
apply = "always"
group_key = "grp.performance"

[config."MaxQueuedMeshLayers"]
type = "int"
default = 1000
control = "platform"
apply = "always"
group_key = "grp.performance"

[config."DynamicMeshEnabled"]
type = "bool"
