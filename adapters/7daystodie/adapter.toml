control = "platform"
apply = "always"
group_key = "grp.performance"

[config."DynamicMeshLandClaimOnly"]
type = "bool"
default = true
control = "platform"
apply = "always"
group_key = "grp.performance"

[config."DynamicMeshLandClaimBuffer"]
type = "int"
default = 3
control = "platform"
apply = "always"
group_key = "grp.performance"

[config."DynamicMeshMaxItemCache"]
type = "int"
default = 3
control = "platform"
apply = "always"
group_key = "grp.performance"

# ---- 领地 Land claim ----
[config."LandClaimCount"]
type = "int"
default = 5
