apply = "always"
group_key = "grp.landclaim"

[config."LandClaimDeadZone"]
type = "int"
default = 30
control = "player"
apply = "always"
group_key = "grp.landclaim"

[config."LandClaimExpiryTime"]
type = "int"
default = 7
control = "player"
apply = "always"
group_key = "grp.landclaim"

[config."LandClaimDecayMode"]
