syntax = "proto3";

package assetservice.v1;

import "asset_service.proto";

service BusinessService {
  // Game 增删改查
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  rpc GetGame(GetGameRequest) returns (GetGameResponse);
  rpc UpdateGame(UpdateGameRequest) returns (UpdateGameResponse);
  rpc DeleteGame(DeleteGameRequest) returns (DeleteGameResponse);
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);

  // Node 增删改查
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // NodeAgent 增删改查
  rpc RegisterNodeAgent(RegisterNodeAgentRequest) returns (RegisterNodeAgentResponse);
  rpc GetNodeAgent(GetNodeAgentRequest) returns (GetNodeAgentResponse);
  rpc UpdateNodeAgent(UpdateNodeAgentRequest) returns (UpdateNodeAgentResponse);
  rpc UnregisterNodeAgent(UnregisterNodeAgentRequest) returns (UnregisterNodeAgentResponse);
  rpc ListNodeAgents(ListNodeAgentsRequest) returns (ListNodeAgentsResponse);
}

// ==================== Game ====================

message CreateGameRequest {
  Game game = 1;
}

message CreateGameResponse {
  Game game = 1;
}

message GetGameRequest {
  string id = 1;
}

message GetGameResponse {
  Game game = 1;
}

message UpdateGameRequest {
  Game game = 1;
}

message UpdateGameResponse {
  Game game = 1;
}

message DeleteGameRequest {
  string id = 1;
}

message DeleteGameResponse {}

message ListGamesRequest {}

message ListGamesResponse {
  repeated Game games = 1;
}

// ==================== Node ====================

message Node {
  string id = 1;
  string ip = 2;
  int32 core_num = 3;
  double core_frequency = 4;
  int64 memory_size = 5;
  int64 storage_size = 6;
  string location = 7;
  string service_provider = 8;
  string status = 9;
}

message CreateNodeRequest {
  Node node = 1;
}

message CreateNodeResponse {
  Node node = 1;
}

message GetNodeRequest {
  string id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message UpdateNodeRequest {
  Node node = 1;
}

message UpdateNodeResponse {
  Node node = 1;
}

message DeleteNodeRequest {
  string id = 1;
}

message DeleteNodeResponse {}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

// ==================== NodeAgent ====================

message NodeAgent {
  string node_id = 1;
  string endpoint = 2;
  string status = 3;
  int64 last_heartbeat_at = 4;
}

message RegisterNodeAgentRequest {
  NodeAgent agent = 1;
}

message RegisterNodeAgentResponse {
  NodeAgent agent = 1;
}

message GetNodeAgentRequest {
  string node_id = 1;
}

message GetNodeAgentResponse {
  NodeAgent agent = 1;
}

message UpdateNodeAgentRequest {
  NodeAgent agent = 1;
}

message UpdateNodeAgentResponse {
  NodeAgent agent = 1;
}

message UnregisterNodeAgentRequest {
  string node_id = 1;
}

message UnregisterNodeAgentResponse {}

message ListNodeAgentsRequest {}

message ListNodeAgentsResponse {
  repeated NodeAgent agents = 1;
}
