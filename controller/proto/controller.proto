syntax = "proto3";

package controller.v1;

service ControllerService {
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc RequestStopInstance(RequestStopInstanceRequest) returns (RequestStopInstanceResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);
  rpc ReconcileInstance(ReconcileInstanceRequest) returns (ReconcileInstanceResponse);
  rpc ReportRuntimeStatus(ReportRuntimeStatusRequest) returns (ReportRuntimeStatusResponse);
}

message CreateInstanceRequest {
  GameKind game = 1;
  VersionSelector version_selector = 2;
  InstanceSpec spec = 3;
}

message CreateInstanceResponse {
  GameInstance instance = 1;
}

message GetInstanceRequest {
  string instance_id = 1;
}

message GetInstanceResponse {
  GameInstance instance = 1;
}

message ListInstancesRequest {
  repeated RuntimeState runtime_states = 1;
  optional DesiredState desired_state = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListInstancesResponse {
  repeated GameInstance instances = 1;
  string next_page_token = 2;
}

message RequestStopInstanceRequest {
  string instance_id = 1;
  optional string reason = 2;
}

message RequestStopInstanceResponse {
  GameInstance instance = 1;
}

message CreateSnapshotRequest {
  string instance_id = 1;
  SnapshotType snapshot_type = 2;
}

message CreateSnapshotResponse {
  GameInstance instance = 1;
  SnapshotReference snapshot = 2;
}

message RestoreSnapshotRequest {
  string instance_id = 1;
  string snapshot_id = 2;
}

message RestoreSnapshotResponse {
  GameInstance instance = 1;
  SnapshotReference snapshot = 2;
}

message ReconcileInstanceRequest {
  string instance_id = 1;
}

message ReconcileInstanceResponse {
  GameInstance instance = 1;
  ReconcileAction last_action = 2;
}

message ReportRuntimeStatusRequest {
  string instance_id = 1;
  RuntimeState runtime_state = 2;
  optional Endpoint endpoint = 3;
  optional string message = 4;
}

message ReportRuntimeStatusResponse {
  GameInstance instance = 1;
}

message GameInstance {
  string instance_id = 1;
  GameKind game = 2;
  DesiredState desired_state = 3;
  RuntimeState runtime_state = 4;
  VersionSelector version_selector = 5;
  optional GameBuild resolved_build = 6;
  InstanceSpec spec = 7;
  optional NodeAssignment assignment = 8;
  optional Endpoint endpoint = 9;
  optional SnapshotReference latest_snapshot = 10;
  optional SnapshotReference pending_restore_snapshot = 11;
  optional FailureInfo failure = 12;
  string created_at = 13;
  string updated_at = 14;
  uint64 generation = 15;
  optional string custom_game = 16;
}

message VersionSelector {
  oneof selector {
    string channel = 1;
    string build_id = 2;
  }
}

message GameBuild {
  string build_id = 1;
  GameKind game = 2;
  optional string channel = 3;
  optional string adapter_version = 4;
  optional string custom_game = 5;
}

message InstanceSpec {
  string cluster_name = 1;
  uint32 max_players = 2;
  ResourceRequirements resources = 3;
  optional string world_preset = 4;
  optional string mod_manifest_id = 5;
}

message ResourceRequirements {
  uint32 cpu_millis = 1;
  uint32 memory_mb = 2;
  uint32 disk_mb = 3;
}

message NodeAssignment {
  string node_id = 1;
  string reason = 2;
}

message Endpoint {
  string host = 1;
  uint32 game_port = 2;
  optional uint32 query_port = 3;
}

message SnapshotReference {
  string snapshot_id = 1;
  optional string storage_uri = 2;
  optional string manifest_uri = 3;
  optional string checksum = 4;
}

message FailureInfo {
  string step = 1;
  string reason = 2;
  bool retryable = 3;
}

message ReconcileAction {
  oneof action {
    NoOpAction no_op = 1;
    ResolvedBuildAction resolved_build = 2;
    AssignedNodeAction assigned_node = 3;
    BuildPreparationRequestedAction build_preparation_requested = 4;
    StartRequestedAction start_requested = 5;
    MarkedRunningAction marked_running = 6;
    StopRequestedAction stop_requested = 7;
    MarkedStoppedAction marked_stopped = 8;
  }
}

message NoOpAction {}
message ResolvedBuildAction {
  GameBuild build = 1;
}
message AssignedNodeAction {
  NodeAssignment assignment = 1;
}
message BuildPreparationRequestedAction {
  string node_id = 1;
  GameBuild build = 2;
}
message StartRequestedAction {
  string node_id = 1;
  optional Endpoint endpoint = 2;
}
message MarkedRunningAction {
  optional Endpoint endpoint = 1;
}
message StopRequestedAction {}
message MarkedStoppedAction {}

enum GameKind {
  GAME_KIND_UNSPECIFIED = 0;
  GAME_KIND_DST = 1;
  GAME_KIND_MINECRAFT = 2;
  GAME_KIND_CUSTOM = 3;
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_RUNNING = 1;
  DESIRED_STATE_STOPPED = 2;
}

enum SnapshotType {
  SNAPSHOT_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_TYPE_MANUAL = 1;
  SNAPSHOT_TYPE_SCHEDULED = 2;
  SNAPSHOT_TYPE_PRE_UPGRADE = 3;
  SNAPSHOT_TYPE_FINAL_STOP = 4;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_PENDING = 1;
  RUNTIME_STATE_RELOCATION_PENDING = 2;
  RUNTIME_STATE_RESOLVING_BUILD = 3;
  RUNTIME_STATE_SCHEDULING = 4;
  RUNTIME_STATE_PREPARING_BUILD = 5;
  RUNTIME_STATE_RESTORING_SNAPSHOT = 6;
  RUNTIME_STATE_STARTING = 7;
  RUNTIME_STATE_RUNNING = 8;
  RUNTIME_STATE_STOP_REQUESTED = 9;
  RUNTIME_STATE_STOPPING = 10;
  RUNTIME_STATE_STOPPED = 11;
  RUNTIME_STATE_FAILED = 12;
}
