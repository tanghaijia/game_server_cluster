syntax = "proto3";

package nodeagent.v1;

// 错误类别 —— 决定恢复策略(不可重试 / 可重试 / 需人工介入 / 需告警)
enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  // 请求或参数错误,重试无意义
  ERROR_CATEGORY_INVALID_REQUEST = 1;
  // 资源不存在,通常不可重试
  ERROR_CATEGORY_NOT_FOUND = 2;
  // 状态冲突,需人工介入
  ERROR_CATEGORY_CONFLICT = 3;
  // 基础设施错误(磁盘/网络/容器/镜像/S3),通常可重试
  ERROR_CATEGORY_INFRASTRUCTURE = 4;
  // 超时,可重试
  ERROR_CATEGORY_TIMEOUT = 5;
  // 内部错误,需告警
  ERROR_CATEGORY_INTERNAL = 6;
}

// 细粒度业务错误码 —— 全局唯一、稳定,客户端 switch 判定的依据。
// 码段规划:1xxx 通用 / 2xxx 构建 / 3xxx 实例 / 4xxx 快照 / 5xxx 基础设施 / 6xxx 超时。
enum BusinessErrorCode {
  BUSINESS_ERROR_CODE_UNSPECIFIED = 0;

  // ---- 通用 1xxx ----
  BUSINESS_ERROR_CODE_INVALID_ARGUMENT = 1001;
  BUSINESS_ERROR_CODE_OPERATION_NOT_FOUND = 1002;
  BUSINESS_ERROR_CODE_INTERNAL_ERROR = 1003;
  BUSINESS_ERROR_CODE_DB_OPERATION_FAILED = 1004;

  // ---- 构建 2xxx ----
  BUSINESS_ERROR_CODE_BUILD_NOT_FOUND = 2001;
  BUSINESS_ERROR_CODE_BUILD_CACHE_MISS = 2002;
  BUSINESS_ERROR_CODE_BUILD_PREPARE_FAILED = 2003;
  BUSINESS_ERROR_CODE_BUILD_DOWNLOAD_FAILED = 2004;
  BUSINESS_ERROR_CODE_BUILD_DOWNLOAD_TIMEOUT = 2005;

  // ---- 实例 3xxx ----
  BUSINESS_ERROR_CODE_INSTANCE_NOT_FOUND = 3001;
  BUSINESS_ERROR_CODE_INSTANCE_ALREADY_EXISTS = 3002;
  BUSINESS_ERROR_CODE_INSTANCE_START_FAILED = 3003;
  BUSINESS_ERROR_CODE_INSTANCE_STOP_FAILED = 3004;
  BUSINESS_ERROR_CODE_INSTANCE_RUNTIME_FAILED = 3005;

  // ---- 快照 4xxx ----
  BUSINESS_ERROR_CODE_SNAPSHOT_NOT_FOUND = 4001;
  BUSINESS_ERROR_CODE_SNAPSHOT_CREATE_FAILED = 4002;
  BUSINESS_ERROR_CODE_SNAPSHOT_RESTORE_FAILED = 4003;
  BUSINESS_ERROR_CODE_SNAPSHOT_EMPTY = 4004;

  // ---- 基础设施 5xxx ----
  BUSINESS_ERROR_CODE_DISK_INSUFFICIENT = 5001;
  BUSINESS_ERROR_CODE_RESOURCE_INSUFFICIENT = 5002;
  BUSINESS_ERROR_CODE_NETWORK_ERROR = 5003;
  BUSINESS_ERROR_CODE_CONTAINER_ERROR = 5004;
  BUSINESS_ERROR_CODE_IMAGE_PULL_FAILED = 5005;
  BUSINESS_ERROR_CODE_S3_DOWNLOAD_FAILED = 5006;
  BUSINESS_ERROR_CODE_S3_UPLOAD_FAILED = 5007;

  // ---- 超时 6xxx ----
  BUSINESS_ERROR_CODE_OPERATION_TIMEOUT = 6001;
}

// 结构化错误详情:NodeOperation.status == FAILED 时填充。
// 也用于同步接口的 rich error model —— 打包进 google.rpc.Status.details。
message ErrorDetail {
  BusinessErrorCode code = 1;
  ErrorCategory category = 2;
  string message = 3;
  bool retryable = 4;
  map<string, string> params = 5;
}
