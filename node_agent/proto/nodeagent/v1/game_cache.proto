syntax = "proto3";

package nodeagent.v1;
option go_package = "controller-go/internal/third/nodeagent/v1;nodeagentv1";
import "google/protobuf/timestamp.proto";


enum GameCacheStatus {
    DOWNLOADING = 0;
    AVAILABLE = 1;
    REMOVED = 2;
    UNAVAILABLE = 3;
}

message GameCache {
    string game_id = 1;
    string branch_name = 2;
    string build_id = 8;
    GameCacheStatus status = 3;
    optional string path = 4;
    optional float download_progress = 5;
    google.protobuf.Timestamp create_time = 6;
    google.protobuf.Timestamp update_time = 7;
    // P2-B：缓存内容实测字节数（下载完成后 du 统计上报，供 controller 磁盘记账/调度）
    uint64 size_bytes = 9;
}
