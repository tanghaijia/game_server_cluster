[package]
name = "node_agent"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "process","io-util", "fs"] }
tonic = "0.12"
prost-types = "0.13"
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1.0.102"
lmrc-docker = "0.3.16"
bollard = "0.19"
libc = "0.2"
log = "0.4"
env_logger = "0.9"
apalis-core = "1.0.0-rc.9"
apalis-sqlite = "1.0.0-rc.8"
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "sqlite"] }

# 修正：将 rustls-webpki 改为正确存在的 rustls 特性
aws-config = { version = "1.0", features = ["behavior-version-latest", "rustls"] }
aws-sdk-s3 = { version = "1.0", features = ["rt-tokio", "rustls"] }
aws-smithy-types = { version = "1.0", features = ["rt-tokio"] }

tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
bytes = "1.0"
futures-util = "0.3"
tokio-stream = "0.1"
http-body-util = "0.1"
http-body = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
sysinfo = "0.33"
regex = "1"

# 实例文件管理服务（M1，见 docs/file-manager-design.md）
axum = "0.8"
jsonwebtoken = "9"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3" # 用于安全地创建临时测试目录
aws-smithy-runtime = { version = "1", features = ["client", "test-util"] } # 核心 Mock 工具
aws-credential-types = "1"
http = "1"
